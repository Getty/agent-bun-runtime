name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Harness Bun: only the test runner, never the Bun under test (the starters install that).
  HARNESS_BUN_VERSION: "1.4.5"

jobs:
  scenarios:
    name: scenarios (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64 sh, os: ubuntu-latest, starter: sh }
          - { name: linux-arm64 sh, os: ubuntu-24.04-arm, starter: sh }
          - { name: windows powershell, os: windows-latest, starter: powershell }
          - { name: windows pwsh, os: windows-latest, starter: pwsh }
    env:
      GETTY_BUN_TEST_STARTER: ${{ matrix.starter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.HARNESS_BUN_VERSION }}
      - name: Versions
        shell: bash
        run: |
          uname -a
          bun --version
          if [ "$RUNNER_OS" = Windows ]; then
            bash --version | head -n 1
          fi
      - name: Windows environment (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable | Format-List | Out-String
          "console input encoding : $([Console]::InputEncoding.WebName) (cp $([Console]::InputEncoding.CodePage))"
          "console output encoding: $([Console]::OutputEncoding.WebName) (cp $([Console]::OutputEncoding.CodePage))"
          "OutputEncoding variable: $($OutputEncoding.WebName)"
          "LanguageMode           : $($ExecutionContext.SessionState.LanguageMode)"
          try {
            $mp = Get-MpComputerStatus -ErrorAction Stop
            "Defender real-time     : $($mp.RealTimeProtectionEnabled)"
          } catch { }
      - name: Windows environment (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSVersionTable | Format-List | Out-String
          "console input encoding : $([Console]::InputEncoding.WebName) (cp $([Console]::InputEncoding.CodePage))"
          "console output encoding: $([Console]::OutputEncoding.WebName) (cp $([Console]::OutputEncoding.CodePage))"
          "OutputEncoding variable: $($OutputEncoding.WebName)"
          "LanguageMode           : $($ExecutionContext.SessionState.LanguageMode)"
          try {
            $mp = Get-MpComputerStatus -ErrorAction Stop
            "Defender real-time     : $($mp.RealTimeProtectionEnabled)"
          } catch { }
      - name: Parse getty-bun.ps1 with Windows PowerShell 5.1
        if: runner.os == 'Windows' && matrix.starter == 'powershell'
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'bootstrap/getty-bun.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            foreach ($e in $errors) { "$($e.Extent.StartLineNumber):$($e.Extent.StartColumnNumber): $($e.Message)" }
            exit 1
          }
          "no parse errors under PowerShell $($PSVersionTable.PSVersion)"
      - uses: ./.github/actions/nunjucks
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/fixtures
          key: fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap/versions.json') }}
      - name: Fetch fixtures
        shell: bash
        run: bun bootstrap/test/fetch-fixtures.ts
      - name: Scenario suite
        shell: bash
        run: bun test bootstrap/test

  static:
    name: shellcheck and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.HARNESS_BUN_VERSION }}
      - uses: ./.github/actions/nunjucks
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck bootstrap/getty-bun.sh
      - name: Starters are pure ASCII
        run: |
          # Windows PowerShell 5.1 reads a file without BOM in the ANSI code page; the sh
          # starter is held to the same rule.
          status=0
          for f in bootstrap/getty-bun.ps1 bootstrap/getty-bun.sh; do
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then
              echo "$f contains non-ASCII bytes" >&2
              status=1
            fi
          done
          exit "$status"
      - name: Pin blocks match a fresh render
        run: bun bootstrap/render-pin.ts --table bootstrap/versions.json --version "$PIN_VERSION" --check bootstrap/getty-bun.sh bootstrap/getty-bun.ps1
        env:
          # The Bun the starters pin (bootstrap/versions.json); separate from the harness Bun.
          PIN_VERSION: "1.4.5"
      - name: Install template matches the starters
        # The generated .njk files are current (text and exec bit) ...
        run: bun bootstrap/render-template.ts --check
      - name: Install template renders byte for byte through real nunjucks
        # ... and rendered with nunjucks 3.2.4 every table version yields the starter with
        # that version's pin block.
        run: bun bootstrap/render-template.ts --nunjucks "$GETTY_BUN_TEST_NUNJUCKS/node_modules/nunjucks"

  real-download:
    # The plan asks for one real-download job. Two legs of one job (the ci-worker's call):
    # sh on Linux, and Windows PowerShell 5.1, whose TLS defaults are the risk the leg
    # exists for.
    name: real download (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64 sh, os: ubuntu-latest, starter: sh }
          - { name: windows powershell, os: windows-latest, starter: powershell }
    env:
      GETTY_BUN_TEST_STARTER: ${{ matrix.starter }}
      GETTY_BUN_TEST_REAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.HARNESS_BUN_VERSION }}
      - uses: ./.github/actions/nunjucks
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/fixtures
          key: fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap/versions.json') }}
      - name: Fetch fixtures
        shell: bash
        run: bun bootstrap/test/fetch-fixtures.ts
      - name: Scenario suite with the real download
        shell: bash
        run: bun test bootstrap/test

  hook-cost:
    name: per-hook cost (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64 sh, os: ubuntu-latest, starter: sh }
          - { name: windows powershell, os: windows-latest, starter: powershell }
          - { name: windows pwsh, os: windows-latest, starter: pwsh }
    env:
      GETTY_BUN_TEST_STARTER: ${{ matrix.starter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.HARNESS_BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/fixtures
          key: fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap/versions.json') }}
      - name: Fetch fixtures
        shell: bash
        run: bun bootstrap/test/fetch-fixtures.ts
      - name: Measure the per-hook cost
        shell: bash
        run: |
          {
            echo "### Per-hook cost: ${{ matrix.name }} (${{ matrix.os }})"
            echo
            bun bootstrap/test/measure-hook.ts
          } | tee -a "$GITHUB_STEP_SUMMARY"

  sdk:
    # The SDK suite (test/) and typecheck. `./test/` with the ./ : a bare `test/` is a path
    # substring filter in bun test and would also run bootstrap/test.
    # One Linux leg and one Windows leg, every step under bash: the tests spawn their
    # children through Bun.spawn, so the step's shell does not reach them. The Windows leg
    # is there for the k11 empty-output case (stdout on a pipe, Bun.write of an empty
    # buffer fails with EINVAL on Windows); its negative control is skipped off Windows, so
    # the JUnit report is checked to prove it ran there.
    name: sdk checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.HARNESS_BUN_VERSION }}
      - name: Install
        shell: bash
        run: bun install --frozen-lockfile
      - name: Typecheck
        # tsc output does not depend on the OS; the gate job's prepack build runs tsc on
        # every platform anyway, which covers the native tsc binary per platform.
        if: runner.os == 'Linux'
        shell: bash
        run: bun run typecheck
      - name: SDK tests
        shell: bash
        run: |
          mkdir -p .dev
          rm -f .dev/sdk-junit.xml
          bun test ./test/ --reporter=junit --reporter-outfile=.dev/sdk-junit.xml
      - name: SDK tests ran (negative control on Windows)
        shell: bash
        run: |
          # Windows-only cases are skipped elsewhere, so skips are allowed; on Windows the
          # k11 raw-empty-write control must be present and not skipped.
          if [ "$RUNNER_OS" = Windows ]; then
            bun .github/scripts/assert-tests-ran.ts --allow-skips --require-ran "fails with EINVAL on Windows" .dev/sdk-junit.xml
          else
            bun .github/scripts/assert-tests-ran.ts --allow-skips .dev/sdk-junit.xml
          fi

  gate:
    # Phase 2 gate (docs/plan.md): the packed SDK, bundled into a scratch consumer, runs
    # offline through the starter under test. The harness Bun only runs the test file; the
    # Bun the starter installs is the one under test.
    name: gate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64 sh, os: ubuntu-latest, starter: sh }
          - { name: linux-arm64 sh, os: ubuntu-24.04-arm, starter: sh }
          - { name: windows powershell, os: windows-latest, starter: powershell }
          - { name: windows pwsh, os: windows-latest, starter: pwsh }
    env:
      GETTY_BUN_TEST_STARTER: ${{ matrix.starter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.HARNESS_BUN_VERSION }}
      - uses: ./.github/actions/nunjucks
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dev/fixtures
          key: fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap/versions.json') }}
      - name: Fetch fixtures
        shell: bash
        run: bun bootstrap/test/fetch-fixtures.ts
      - name: Install
        # bun pm pack runs the prepack build (tsc), which needs the dev dependencies.
        shell: bash
        run: bun install --frozen-lockfile
      - name: Gate
        shell: bash
        run: |
          # A skipped gate exits 0 in bun test, so the JUnit report is checked: the step
          # fails on 0 tests, on any skipped test, and on a missing report.
          rm -f .dev/gate-junit.xml
          GETTY_BUN_TEST_GATE=1 bun test ./test/gate/ --reporter=junit --reporter-outfile=.dev/gate-junit.xml
          bun .github/scripts/assert-tests-ran.ts .dev/gate-junit.xml
