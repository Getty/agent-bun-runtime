name: publish

# Publishes @getty/agent-bun-runtime to npm through trusted publishing (OIDC, provenance,
# no token secret). npm registers this exact file name (publish.yml) in the package's
# trusted publisher configuration; renaming the file breaks the publish.
#
# Only a pushed tag v* starts it: never a branch push, a pull request or a manual run
# (a manual run from a branch would publish that branch's code). The tag is the owner's go.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Harness Bun, as in ci.yml: installs, typechecks, tests and packs. Not the Bun under test.
  HARNESS_BUN_VERSION: "1.4.5"

jobs:
  build:
    # No id-token here: install scripts, tests and the prepack build never see the OIDC token.
    name: check and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a release tag on main, equal to the package version
        shell: bash
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "not a tag ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          version=$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' package.json)
          if [ -z "$version" ]; then
            echo "no version in package.json" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not equal v$version (package.json)" >&2
            exit 1
          fi
          # Reviewed work only: the tagged commit is on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main" >&2
            exit 1
          fi
          echo "publishing $version from $GITHUB_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.HARNESS_BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        # ./test/ with the ./ : a bare test/ would also run bootstrap/test.
        run: bun test ./test/
      - name: Pack
        shell: bash
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/pack"
          bun pm pack --destination "$RUNNER_TEMP/pack"
          count=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one tarball, found $count" >&2
            exit 1
          fi
          ls -l "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: npm publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack
      # No registry-url: it makes setup-node write an .npmrc with a token placeholder, and
      # trusted publishing wants no token at all.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm 11.5.1 or later
        shell: bash
        run: |
          set -eu
          # 11.21.3 is the registry's next-11 dist-tag (registry.npmjs.org/npm, 2026-11-27).
          npm install --global "npm@11.21.3"
          node --version
          npm --version
          node -e '
            const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
            const v = (s) => s.replace(/^v/, "").split(".").map(Number);
            if (cmp(v(process.version), [22, 14, 0]) < 0) { console.error("Node " + process.version + " is older than 22.14.0"); process.exit(1); }
            const npm = require("child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
            if (cmp(v(npm), [11, 5, 1]) < 0) { console.error("npm " + npm + " is older than 11.5.1"); process.exit(1); }
          '
      - name: Publish with provenance
        shell: bash
        run: |
          set -eu
          set -- "$RUNNER_TEMP"/pack/*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected exactly one tarball" >&2; exit 1; }
          npm publish "$1" --provenance --access public
